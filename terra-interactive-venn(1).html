<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terra 七區互動式 Venn Navigation</title>
  <style>
    :root{
      --bg:#F5F1E8;
      --green:#68785B;
      --blue:#64748B;
      --orange:#C87952;
      --ab:#587477;
      --ac:#8B744A;
      --bc:#8A6C6B;
      --center:#514D43;
      --text:#FFFDF8;
      --muted:#6F706A;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:var(--bg);
      color:#2f302c;
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:32px 20px 48px;
    }
    .intro{
      text-align:center;
      margin-bottom:18px;
    }
    .intro h1{
      margin:0 0 8px;
      font-size:clamp(24px,4vw,36px);
      font-weight:800;
    }
    .intro p{
      margin:0;
      color:var(--muted);
      font-size:15px;
    }
    svg{
      display:block;
      width:100%;
      height:auto;
      touch-action:manipulation;
    }
    .region{
      opacity:.96;
      transition:opacity .2s ease, filter .2s ease;
      cursor:pointer;
    }
    #terraVenn.has-hover .region{
      opacity:.35;
    }
    #terraVenn .region.is-active{
      opacity:1;
      filter:brightness(1.12) saturate(1.05);
    }
    .info{
      margin-top:18px;
      text-align:center;
      min-height:74px;
    }
    .info strong{
      display:block;
      font-size:20px;
      margin-bottom:6px;
    }
    .info span{
      display:block;
      color:var(--muted);
      font-size:14px;
      margin-top:4px;
    }
    .url{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="intro">
      <h1>Terra 七區互動式 Venn Navigation</h1>
      <p>將滑鼠移到任一區域即可預覽；點擊後會導向該區域設定的頁面。</p>
    </div>

    <svg id="terraVenn" viewBox="0 0 760 680" role="img" aria-label="泰拉七區互動式 Venn 導航圖">
      <defs>
        <circle id="shapeA" cx="380" cy="230" r="205"></circle>
        <circle id="shapeB" cx="255" cy="430" r="205"></circle>
        <circle id="shapeC" cx="505" cy="430" r="205"></circle>

        <clipPath id="clipA"><use href="#shapeA"></use></clipPath>
        <clipPath id="clipB"><use href="#shapeB"></use></clipPath>
        <clipPath id="clipC"><use href="#shapeC"></use></clipPath>

        <mask id="excludeBC">
          <rect width="760" height="680" fill="white"></rect>
          <use href="#shapeB" fill="black"></use>
          <use href="#shapeC" fill="black"></use>
        </mask>
        <mask id="excludeAC">
          <rect width="760" height="680" fill="white"></rect>
          <use href="#shapeA" fill="black"></use>
          <use href="#shapeC" fill="black"></use>
        </mask>
        <mask id="excludeAB">
          <rect width="760" height="680" fill="white"></rect>
          <use href="#shapeA" fill="black"></use>
          <use href="#shapeB" fill="black"></use>
        </mask>
        <mask id="excludeA">
          <rect width="760" height="680" fill="white"></rect>
          <use href="#shapeA" fill="black"></use>
        </mask>
        <mask id="excludeB">
          <rect width="760" height="680" fill="white"></rect>
          <use href="#shapeB" fill="black"></use>
        </mask>
        <mask id="excludeC">
          <rect width="760" height="680" fill="white"></rect>
          <use href="#shapeC" fill="black"></use>
        </mask>

        <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.16"></feDropShadow>
        </filter>
      </defs>

      <rect width="760" height="680" rx="26" fill="#F5F1E8"></rect>

      <g id="regions" filter="url(#lift)">
        <g class="region" data-region="1" mask="url(#excludeBC)">
          <use href="#shapeA" fill="#68785B"></use>
        </g>

        <g class="region" data-region="2" mask="url(#excludeAC)">
          <use href="#shapeB" fill="#64748B"></use>
        </g>

        <g class="region" data-region="4" mask="url(#excludeAB)">
          <use href="#shapeC" fill="#C87952"></use>
        </g>

        <g class="region" data-region="3" clip-path="url(#clipB)" mask="url(#excludeC)">
          <use href="#shapeA" fill="#587477"></use>
        </g>

        <g class="region" data-region="5" clip-path="url(#clipC)" mask="url(#excludeB)">
          <use href="#shapeA" fill="#8B744A"></use>
        </g>

        <g class="region" data-region="6" clip-path="url(#clipC)" mask="url(#excludeA)">
          <use href="#shapeB" fill="#8A6C6B"></use>
        </g>

        <g class="region" data-region="7" clip-path="url(#clipB)">
          <g clip-path="url(#clipC)">
            <use href="#shapeA" fill="#514D43"></use>
          </g>
        </g>
      </g>

      <g fill="#FFFDF8" text-anchor="middle"
         font-family="system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif"
         font-weight="700" pointer-events="none">
        <text x="380" y="155" font-size="29">體驗自然</text>
        <text x="210" y="520" font-size="29">覺察自我</text>
        <text x="550" y="520" font-size="29">理解創造</text>
        <text x="380" y="348" font-size="42" font-weight="800">泰拉</text>
      </g>

      <g fill="#FFFDF8" fill-opacity="0.94" text-anchor="middle"
         font-family="system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif"
         font-size="15" font-weight="700" pointer-events="none">
        <text x="294" y="318">仁人</text>
        <text x="466" y="318">同人</text>
        <text x="380" y="490">職人</text>
      </g>
    </svg>

    <div class="info" aria-live="polite">
      <strong id="regionName">移動游標探索七個區域</strong>
      <span id="regionDesc">每個色塊都可以設定獨立頁面。</span>
      <span id="regionUrl" class="url"></span>
    </div>
  </main>

  <script>
    const svg = document.getElementById('terraVenn');
    const regionName = document.getElementById('regionName');
    const regionDesc = document.getElementById('regionDesc');
    const regionUrl = document.getElementById('regionUrl');
    const regionEls = [...svg.querySelectorAll('.region')];

    const circles = [
      { x: 380, y: 230, r: 205 },
      { x: 255, y: 430, r: 205 },
      { x: 505, y: 430, r: 205 }
    ];

    const regionData = {
      1: { name:'體驗自然', desc:'走進場域、土地與真實情境。', href:'/nature' },
      2: { name:'覺察自我', desc:'看見內在感受、信念與選擇。', href:'/awareness' },
      4: { name:'理解創造', desc:'把理解轉化成設計與行動。', href:'/creation' },
      3: { name:'仁人', desc:'從真實體驗中重新理解自己。', href:'/nature-awareness' },
      5: { name:'同人', desc:'由場域洞察發展新的可能。', href:'/nature-creation' },
      6: { name:'職人', desc:'由自我理解走向有意識的創造。', href:'/awareness-creation' },
      7: { name:'泰拉', desc:'體驗、覺察與創造三者交會。', href:'/terra' }
    };

    function svgPoint(evt){
      const pt = svg.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function getRegion(point){
      let mask = 0;
      circles.forEach((circle,index)=>{
        const dx = point.x - circle.x;
        const dy = point.y - circle.y;
        if(dx*dx + dy*dy <= circle.r*circle.r){
          mask |= (1 << index);
        }
      });
      return mask;
    }

    function activate(mask){
      regionEls.forEach(el=>{
        el.classList.toggle('is-active', Number(el.dataset.region) === mask);
      });

      const item = regionData[mask];
      svg.classList.toggle('has-hover', Boolean(item));
      svg.style.cursor = item ? 'pointer' : 'default';

      if(item){
        regionName.textContent = item.name;
        regionDesc.textContent = item.desc;
        regionUrl.textContent = item.href;
      } else {
        regionName.textContent = '移動游標探索七個區域';
        regionDesc.textContent = '每個色塊都可以設定獨立頁面。';
        regionUrl.textContent = '';
      }
    }

    svg.addEventListener('pointermove', evt=>{
      activate(getRegion(svgPoint(evt)));
    });

    svg.addEventListener('pointerleave', ()=>activate(0));

    svg.addEventListener('click', evt=>{
      const mask = getRegion(svgPoint(evt));
      const item = regionData[mask];
      if(!item) return;
      window.location.href = item.href;
    });
  </script>
</body>
</html>
